name: Flake validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39
      - name: Scan for secrets
        run: nix shell --inputs-from . nixpkgs-unstable#gitleaks -c gitleaks dir . --redact --no-banner
      - name: Evaluate the Linux system
        run: nix flake check --no-write-lock-file
      - name: Evaluate the Apple Silicon system and Home Manager generation
        run: |
          nix eval --raw '.#darwinConfigurations.macOS.system.drvPath'
          nix eval --raw '.#darwinConfigurations.macOS.config.home-manager.users.example.home.activationPackage.drvPath'
      - name: Check Nix and shell sources
        run: |
          nix shell --inputs-from . nixpkgs-unstable#statix nixpkgs-unstable#deadnix nixpkgs-unstable#shellcheck -c bash -euo pipefail -c '
            statix check
            deadnix --fail
            find scripts -name "*.sh" -print0 | xargs -0 shellcheck
          '

  check-brewfile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Update Homebrew index
        run: brew update --quiet
      - name: Register custom taps
        run: |
          awk '/^tap / {gsub(/"/, "", $2); print $2}' config/Brewfile \
            | while read -r tap; do
                echo "::group::tap $tap"
                brew tap "$tap"
                echo "::endgroup::"
              done
      - name: Verify all formulas and casks are resolvable
        run: |
          rc=0
          while IFS=' ' read -r type name; do
            if [[ "$type" == "brew" ]]; then
              brew info "$name" &>/dev/null \
                || { echo "::error file=config/Brewfile::Unknown formula: $name"; rc=1; }
            else
              brew info --cask "$name" &>/dev/null \
                || { echo "::error file=config/Brewfile::Unknown cask: $name"; rc=1; }
            fi
          done < <(awk '/^brew / {gsub(/"/, "", $2); print "brew " $2}
                        /^cask / {gsub(/"/, "", $2); print "cask " $2}' config/Brewfile)
          exit $rc

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-macos-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-macos-
          gc-max-store-size-macos: 10239M # GitHub Actions cache is capped at 10GB, so let's get 10 GB - 1MB.
          purge: true
          purge-prefixes: nix-macos-
          purge-created: 0
          purge-primary-key: never
      - name: Verify the runner architecture
        run: test "$(uname -m)" = arm64
      - name: Build the Apple Silicon system without activation
        run: nix build --no-write-lock-file '.#darwinConfigurations.macOS.system'

  test-shellscripts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install bats-core (macOS)
        run: brew install bats-core
      - name: Run tests (macOS)
        run: bats --tap tests/home-layout.bats tests/macOS

  test-shellscripts-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install bats-core (Linux)
        run: sudo apt-get install -y bats
      - name: Run tests (Linux)
        run: bats --tap tests/home-layout.bats tests/getting-started-new-codebase.bats tests/linux-laptop

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install pytest
        run: pip install pytest
      - name: Run Python tests
        run: pytest -v
