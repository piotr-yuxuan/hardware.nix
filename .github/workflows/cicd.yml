name: Flake validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A manual run checks the head of the branch again and releases it: after a
  # release that failed, or to open a new minor or major line.
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version that the release raises
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read # every job reads the repository; only `release` is given more

# A newer push cancels the run of its branch. It cannot cut a release in two:
# once the version commit exists, only a push that contains it is accepted. A
# manual run could, so it waits for the run in progress and cancels nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check-flake:
    name: Gate the history and check the flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the two history checks below read every commit
          persist-credentials: false
      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      # A pull request adds commits that this repository did not make.
      - name: Gate every commit and tree for personal data
        if: github.event_name != 'pull_request'
        run: nix shell --inputs-from . nixpkgs-unstable#python3 -c python3 scripts/publish.py check . --allow .github/publish-allow.toml
      - name: Scan the history for secrets
        if: github.event_name != 'pull_request'
        run: nix shell --inputs-from . nixpkgs-unstable#gitleaks -c gitleaks git . --redact --no-banner
      - name: Evaluate the Linux system and the Apple Silicon system
        run: nix flake check --no-write-lock-file
      - name: Check that the Mac template yields the evaluated system
        run: |
          expected=$(nix eval --raw '.#darwinConfigurations.macOS.system.drvPath')
          template=$(mktemp -d)
          (cd "$template" && nix flake init -t "$GITHUB_WORKSPACE#macOS")
          actual=$(nix eval --raw --no-write-lock-file --override-input base "$GITHUB_WORKSPACE" "$template#darwinConfigurations.macOS.system.drvPath")
          test "$expected" = "$actual"
      - name: Check Nix and shell sources
        run: |
          nix shell --inputs-from . nixpkgs-unstable#statix nixpkgs-unstable#deadnix nixpkgs-unstable#shellcheck -c bash -euo pipefail -c '
            statix check
            deadnix --fail
            find scripts -name "*.sh" -print0 | xargs -0 shellcheck
          '
      - name: Check the workflow files
        env:
          GH_TOKEN: ${{ github.token }} # zizmor asks GitHub about the pinned actions
        run: |
          nix shell --inputs-from . nixpkgs-unstable#actionlint nixpkgs-unstable#shellcheck nixpkgs-unstable#zizmor -c bash -euo pipefail -c '
            actionlint
            zizmor .github/workflows
          '

  check-brewfile:
    name: Resolve the Brewfile
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Update Homebrew index
        run: brew update --quiet
      - name: Register custom taps
        run: |
          awk '/^tap / {gsub(/[",]/, "", $2); print $2}' config/Brewfile \
            | while read -r tap; do
                echo "::group::tap $tap"
                brew tap "$tap"
                echo "::endgroup::"
              done
      - name: Verify all formulas and casks are resolvable
        run: |
          rc=0
          while IFS=' ' read -r type name; do
            if [[ "$type" == "brew" ]]; then
              brew info "$name" &>/dev/null \
                || { echo "::error file=config/Brewfile::Unknown formula: $name"; rc=1; }
            else
              brew info --cask "$name" &>/dev/null \
                || { echo "::error file=config/Brewfile::Unknown cask: $name"; rc=1; }
            fi
          done < <(awk '/^brew / {gsub(/[",]/, "", $2); print "brew " $2}
                        /^cask / {gsub(/[",]/, "", $2); print "cask " $2}' config/Brewfile)
          exit $rc

  build:
    name: Build the system
    # macOS builds the whole system. Once built, the Linux system takes about 47 GiB, more
    # than a hosted runner holds: Linux only resolves it, which lists what would be built
    # and what would be fetched.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            target: darwinConfigurations.macOS.system
            mode: ""
          - os: ubuntu-latest
            architecture: x86_64
            target: nixosConfigurations.nixOS.config.system.build.toplevel
            mode: --dry-run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff # v31.10.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        if: runner.os == 'macOS' # a dry run puts nothing in the store
        with:
          primary-key: nix-macos-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-macos-
          gc-max-store-size-macos: 10239M # GitHub Actions cache is capped at 10GB, so let's get 10 GB - 1MB.
          purge: true
          purge-prefixes: nix-macos-
          purge-created: 0
          purge-primary-key: never
      - name: Verify the runner architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$ARCHITECTURE"
      - name: Build the system without activation
        env:
          MODE: ${{ matrix.mode }}
          TARGET: ${{ matrix.target }}
        run: nix build ${MODE:+"$MODE"} --no-write-lock-file ".#$TARGET"

  test-shellscripts:
    name: Test the shell scripts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tests: tests/home-layout.bats tests/macOS
          - os: ubuntu-latest
            tests: tests/home-layout.bats tests/getting-started-new-codebase.bats tests/nixOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Install Bats and Zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bats zsh
      - name: Run the shell tests of this system
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          read -r -a tests <<< "$TESTS"
          bats --tap "${tests[@]}"

  test-python:
    name: Test the Python scripts
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install Zsh for watchdog integration tests (Linux; macOS ships it)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
      - name: Install pytest and the history rewriting tool
        run: pip install pytest git-filter-repo
      - name: Run Python tests
        run: pytest -v

  release:
    name: Release the checked commit
    # Every other job: one that is left out would be released unchecked.
    needs: [check-flake, check-brewfile, build, test-shellscripts, test-python]
    # Never for a pull request, for another branch or in a fork.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/master'
      && github.repository == 'piotr-yuxuan/hardware.nix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the version commit, its tag, the release and the channel
      deployments: write # the deployment record
    steps:
      # This job writes to the repository: it runs GitHub's own action and the
      # script of this commit, with the Python of the runner and nothing else.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the next version and the notes read every tag
          persist-credentials: false
      - name: Raise the version, tag, publish and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }} # empty for a push, which raises the patch
        run: python3 scripts/release.py
